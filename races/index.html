<!DOCTYPE html><html lang="zh-Hans"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>越野赛计划</title><style>
:root{--ink:#0f172a;--dim:#475569;--line:#cbd5e1;--accent:#1d4ed8;--night:#5b21b6;--bg:#f8fafc}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
main{max-width:1180px;margin:0 auto;padding:24px 18px 50px}
h1{font-size:24px;margin:0 0 2px}
h2{font-size:17px;margin:26px 0 8px;border-bottom:2px solid var(--line);padding-bottom:4px}
.sub{color:var(--dim);font-size:13px;margin:0 0 10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.btn{display:inline-block;border:1px solid var(--ink);border-radius:8px;padding:5px 12px;font-size:13px;text-decoration:none;color:var(--ink);background:#fff;cursor:pointer}
.btn.primary{background:var(--ink);color:#fff}
.btn:active{transform:translateY(1px)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.card .k{font-size:11.5px;color:var(--dim)}
.card .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--dim)}
.controls input{font:inherit;font-size:15px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px}
th,td{border-bottom:1px solid #e2e8f0;padding:5px 7px;text-align:left;vertical-align:middle}
th{background:#1f4e79;color:#fff;font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.night td{background:#f5f2fc}
tr:hover td{background:#f1f5f9}
input.stop{width:54px;font:inherit;font-size:12.5px;text-align:right;padding:2px 4px;border:1px solid var(--line);border-radius:5px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;border:1px solid currentColor}
.tag.night{color:var(--night)}
.tag.day{color:#047857}
.note{font-size:12.5px;color:var(--dim);background:#fff;border-left:3px solid var(--accent);padding:8px 12px;margin:10px 0}
svg.profile{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.viz{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin:10px 0}
#map{height:440px;background:#eef2f7}
.cp-map-label{background:transparent!important;border:none!important;box-shadow:none!important;padding:0 2px;font-size:11px;font-weight:800;color:#111827;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff,0 0 2px #fff}
.cp-map-label.leaflet-tooltip:before{display:none}
.viz #chart{padding:2px 6px 0}
footer{margin-top:28px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:10px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#e5e7eb;min-width:140px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding-bottom:2px}
.table-scroll table{min-width:880px}
table.merged{font-size:12px}
@media (max-width:640px){
  main{padding:16px 10px 40px}
  #map{height:300px}
  .viz #chart{padding:0 2px}
  .table-scroll{overflow:visible}
  .table-scroll table{min-width:0}
  table.merged{min-width:0}
  table.merged thead{display:none}
  table.merged, table.merged tbody, table.merged tr, table.merged td{display:block;width:100%}
  table.merged tr{background:#fff;border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:8px 10px}
  table.merged td{border:none;padding:3px 0;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  table.merged td::before{content:attr(data-label);color:var(--dim);font-size:11.5px;font-weight:400;flex:0 0 auto}
  table.merged td[data-label="CP"]{font-weight:700;font-size:14px}
  table.merged td[data-label="路况"] .bar{min-width:0;flex:1;max-width:180px}
  table.merged td[data-label="特点"]{display:block}
  table.merged td[data-label="特点"]::before{display:block;margin-bottom:2px}
  table.merged td.num{text-align:right}
}
table.merged .bar{min-width:86px;height:10px}
table.merged th{font-size:11.5px}
.bar span{display:block;height:100%}
.bar.wide{height:16px;border-radius:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin:8px 0}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.bar span.unk,.sw.unk{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px)}
input[type=time]{width:120px}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff}
  main{max-width:none;padding:0}
  .no-print{display:none!important}
  input.stop,input[type=time],input[type=number]{border:none!important;background:transparent!important;text-align:right;width:auto!important;padding:0!important;font-weight:600}
  table{font-size:10px}
  table.merged{font-size:9px}
  table.merged .bar{min-width:60px;height:8px}
  tr{break-inside:avoid}
  svg.profile{max-height:100mm}
  #map{height:95mm}
  .leaflet-control-zoom{display:none!important}
}
</style></head>
<body><main><h1>越野赛计划</h1><p class="sub">race-planner · 本地入口</p>
<p class="sub">赛前准备用：赛道分析、可自己改的时刻表、可打印 PDF。</p><table><thead><tr><th>比赛</th><th class='num'>距离</th><th class='num'>爬升</th><th>日期</th><th>计划</th></tr></thead><tbody><tr><td>2026 从化一百 100K</td><td class='num'>99.5 km</td><td class='num'>5484 m</td><td>2026-11-28</td><td><a class="btn" href="conghua100-2026.html">打开计划</a></td></tr></tbody></table>
<div class="note">新增比赛：在 <code>races/</code> 下建目录放 <code>course.gpx</code> 与
<code>race.toml</code>，再跑 <code>python -m planner site</code>。</div>
</main></body></html>
